# =============================================================
# nginx.conf — Hermes Stack reverse proxy
#
# Rotas públicas:
#   /litellm/   → LiteLLM API/UI  (sem auth — proteger por firewall em prod)
#   /chat1/     → hermes-webui user_01      (basic auth user_01)
#   /chat2/     → hermes-webui user_02      (basic auth user_02)
#   /chat3/     → hermes-webui user_03      (basic auth user_03)
#   /dash01/    → hermes-dashboard user_01  (basic auth user_01)
#   /dash02/    → hermes-dashboard user_02  (basic auth user_02)
#   /dash03/    → hermes-dashboard user_03  (basic auth user_03)
#
# Sub_filter reescreve caminhos absolutos no HTML para que os
# assets das WebUIs e do Dashboard funcionem corretamente sob sub-path.
# proxy_set_header Accept-Encoding "" desabilita gzip no upstream
# para que o sub_filter consiga inspecionar o corpo da resposta.
# =============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Buffers ajustados para streaming SSE (hermes usa SSE)
    proxy_buffering            off;
    proxy_cache                off;
    proxy_read_timeout         300s;
    proxy_connect_timeout      10s;
    proxy_send_timeout         300s;
    client_max_body_size       32m;

    # -----------------------------------------------------------
    # Upstream services (nomes == service names no compose)
    # -----------------------------------------------------------
    upstream litellm_upstream {
        server litellm:4000;
    }
    upstream webui_user01 {
        server hermes-webui-user_01:8787;
    }
    upstream webui_user02 {
        server hermes-webui-user_02:8787;
    }
    upstream webui_user03 {
        server hermes-webui-user_03:8787;
    }
    upstream dash_user01 {
        server hermes-dashboard-user_01:9119;
    }
    upstream dash_user02 {
        server hermes-dashboard-user_02:9119;
    }
    upstream dash_user03 {
        server hermes-dashboard-user_03:9119;
    }

    # -----------------------------------------------------------
    # Servidor principal
    # -----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # -------------------------------------------------------
        # /litellm/ → LiteLLM (API + /ui)
        # Sem basic auth — restrinja por IP/firewall se necessário
        #
        # IMPORTANTE: usar proxy_pass SEM trailing slash para que o
        # prefixo /litellm/ seja preservado na URI repassada. Combinado
        # com SERVER_ROOT_PATH=/litellm no container, o FastAPI monta
        # todas as rotas (/litellm/ui/, /litellm/swagger/*, /litellm/v1/*)
        # já com o prefixo, e nginx só precisa fazer o passthrough.
        # -------------------------------------------------------
        location /litellm/ {
            proxy_pass         http://litellm_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE / WebSocket
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # -------------------------------------------------------
        # /chat1/ → hermes-webui user_01
        # -------------------------------------------------------
        location /chat1/ {
            auth_basic           "Hermes Chat 1";
            auth_basic_user_file /etc/nginx/.htpasswd-user_01;

            proxy_pass         http://webui_user01/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Desabilita gzip para permitir sub_filter
            proxy_set_header   Accept-Encoding   "";

            # SSE / WebSocket
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://webui_user01/ /chat1/;

            # Reescreve caminhos absolutos no HTML
            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/chat1/';
            sub_filter         'src="/'   'src="/chat1/';
            sub_filter         'action="/' 'action="/chat1/';
        }

        # -------------------------------------------------------
        # /chat2/ → hermes-webui user_02
        # -------------------------------------------------------
        location /chat2/ {
            auth_basic           "Hermes Chat 2";
            auth_basic_user_file /etc/nginx/.htpasswd-user_02;

            proxy_pass         http://webui_user02/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://webui_user02/ /chat2/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/chat2/';
            sub_filter         'src="/'   'src="/chat2/';
            sub_filter         'action="/' 'action="/chat2/';
        }

        # -------------------------------------------------------
        # /chat3/ → hermes-webui user_03
        # -------------------------------------------------------
        location /chat3/ {
            auth_basic           "Hermes Chat 3";
            auth_basic_user_file /etc/nginx/.htpasswd-user_03;

            proxy_pass         http://webui_user03/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://webui_user03/ /chat3/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/chat3/';
            sub_filter         'src="/'   'src="/chat3/';
            sub_filter         'action="/' 'action="/chat3/';
        }

        # -------------------------------------------------------
        # /dash01/ → hermes-dashboard user_01
        # Reusa o mesmo basic auth do /chat1/ (mesmo usuario).
        # -------------------------------------------------------
        location /dash01/ {
            auth_basic           "Hermes Dashboard 1";
            auth_basic_user_file /etc/nginx/.htpasswd-user_01;

            proxy_pass         http://dash_user01/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://dash_user01/ /dash01/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/dash01/';
            sub_filter         'src="/'   'src="/dash01/';
            sub_filter         'action="/' 'action="/dash01/';
        }

        # -------------------------------------------------------
        # /dash02/ → hermes-dashboard user_02
        # -------------------------------------------------------
        location /dash02/ {
            auth_basic           "Hermes Dashboard 2";
            auth_basic_user_file /etc/nginx/.htpasswd-user_02;

            proxy_pass         http://dash_user02/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://dash_user02/ /dash02/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/dash02/';
            sub_filter         'src="/'   'src="/dash02/';
            sub_filter         'action="/' 'action="/dash02/';
        }

        # -------------------------------------------------------
        # /dash03/ → hermes-dashboard user_03
        # -------------------------------------------------------
        location /dash03/ {
            auth_basic           "Hermes Dashboard 3";
            auth_basic_user_file /etc/nginx/.htpasswd-user_03;

            proxy_pass         http://dash_user03/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://dash_user03/ /dash03/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/dash03/';
            sub_filter         'src="/'   'src="/dash03/';
            sub_filter         'action="/' 'action="/dash03/';
        }

        # -------------------------------------------------------
        # Raiz — redireciona para /chat1/ como atalho
        # -------------------------------------------------------
        location = / {
            return 302 /chat1/;
        }

        # Bloqueia qualquer rota não mapeada
        location / {
            return 404;
        }
    }
}
