# =============================================================
# nginx.conf — Hermes Stack reverse proxy
#
# Rotas públicas:
#   Porta 80:
#     /litellm/    → LiteLLM API/UI  (sem auth — proteger por firewall em prod)
#     /chat01..03/ → hermes-webui user_0X (basic auth user_0X)
#     /dash01..03  → 302 redirect para a porta dedicada do dashboard
#   Porta 9001:    → hermes-dashboard user_01 (basic auth user_01)
#   Porta 9002:    → hermes-dashboard user_02 (basic auth user_02)
#   Porta 9003:    → hermes-dashboard user_03 (basic auth user_03)
#
# A WebUI (chat) e o LiteLLM toleram sub-path graças a sub_filter e
# SERVER_ROOT_PATH respectivamente. Já o Dashboard do Hermes é uma SPA
# que faz fetch() e WebSocket com paths absolutos em runtime, escapando
# do sub_filter — por isso cada um roda da raiz em sua própria porta.
#
# proxy_set_header Accept-Encoding "" desabilita gzip no upstream
# para que o sub_filter consiga inspecionar o corpo da resposta.
# =============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Buffers ajustados para streaming SSE (hermes usa SSE)
    proxy_buffering            off;
    proxy_cache                off;
    proxy_read_timeout         300s;
    proxy_connect_timeout      10s;
    proxy_send_timeout         300s;
    client_max_body_size       32m;

    # -----------------------------------------------------------
    # Upstream services (nomes == service names no compose)
    # -----------------------------------------------------------
    upstream litellm_upstream {
        server litellm:4000;
    }
    upstream webui_user01 {
        server hermes-webui-user_01:8787;
    }
    upstream webui_user02 {
        server hermes-webui-user_02:8787;
    }
    upstream webui_user03 {
        server hermes-webui-user_03:8787;
    }
    upstream dash_user01 {
        server hermes-dashboard-user_01:9119;
    }
    upstream dash_user02 {
        server hermes-dashboard-user_02:9119;
    }
    upstream dash_user03 {
        server hermes-dashboard-user_03:9119;
    }

    # -----------------------------------------------------------
    # Servidor principal
    # -----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # -------------------------------------------------------
        # /litellm/ → LiteLLM (API + /ui)
        # Sem basic auth — restrinja por IP/firewall se necessário
        #
        # IMPORTANTE: usar proxy_pass SEM trailing slash para que o
        # prefixo /litellm/ seja preservado na URI repassada. Combinado
        # com SERVER_ROOT_PATH=/litellm no container, o FastAPI monta
        # todas as rotas (/litellm/ui/, /litellm/swagger/*, /litellm/v1/*)
        # já com o prefixo, e nginx só precisa fazer o passthrough.
        # -------------------------------------------------------
        location /litellm/ {
            proxy_pass         http://litellm_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE / WebSocket
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # -------------------------------------------------------
        # /chat01/ → hermes-webui user_01
        # -------------------------------------------------------
        location /chat01/ {
            auth_basic           "Hermes Chat 1";
            auth_basic_user_file /etc/nginx/.htpasswd-user_01;

            proxy_pass         http://webui_user01/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Desabilita gzip para permitir sub_filter
            proxy_set_header   Accept-Encoding   "";

            # SSE / WebSocket
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Reescreve Location headers: 1ª captura URLs absolutas,
            # 2ª captura paths absolutos (/login, /, etc).
            proxy_redirect     http://webui_user01/ /chat01/;
            proxy_redirect     /                    /chat01/;

            # Reescreve caminhos absolutos no HTML
            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/chat01/';
            sub_filter         'src="/'   'src="/chat01/';
            sub_filter         'action="/' 'action="/chat01/';
        }

        # -------------------------------------------------------
        # /chat02/ → hermes-webui user_02
        # -------------------------------------------------------
        location /chat02/ {
            auth_basic           "Hermes Chat 2";
            auth_basic_user_file /etc/nginx/.htpasswd-user_02;

            proxy_pass         http://webui_user02/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://webui_user02/ /chat02/;
            proxy_redirect     /                    /chat02/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/chat02/';
            sub_filter         'src="/'   'src="/chat02/';
            sub_filter         'action="/' 'action="/chat02/';
        }

        # -------------------------------------------------------
        # /chat03/ → hermes-webui user_03
        # -------------------------------------------------------
        location /chat03/ {
            auth_basic           "Hermes Chat 3";
            auth_basic_user_file /etc/nginx/.htpasswd-user_03;

            proxy_pass         http://webui_user03/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Accept-Encoding   "";

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_redirect     http://webui_user03/ /chat03/;
            proxy_redirect     /                    /chat03/;

            sub_filter_types   text/html;
            sub_filter_once    off;
            sub_filter         'href="/'  'href="/chat03/';
            sub_filter         'src="/'   'src="/chat03/';
            sub_filter         'action="/' 'action="/chat03/';
        }

        # -------------------------------------------------------
        # /dash01..03 → 302 para a porta dedicada do dashboard
        # A SPA do Hermes nao suporta sub-path; cada dashboard roda
        # da raiz em sua propria porta (9001/9002/9003 do host).
        # Aceitamos com e sem trailing slash.
        # -------------------------------------------------------
        location = /dash01  { return 302 $scheme://$host:9001/; }
        location = /dash01/ { return 302 $scheme://$host:9001/; }
        location = /dash02  { return 302 $scheme://$host:9002/; }
        location = /dash02/ { return 302 $scheme://$host:9002/; }
        location = /dash03  { return 302 $scheme://$host:9003/; }
        location = /dash03/ { return 302 $scheme://$host:9003/; }

        # -------------------------------------------------------
        # Raiz — redireciona para /chat01/ como atalho
        # -------------------------------------------------------
        location = / {
            return 302 /chat01/;
        }

        # Bloqueia qualquer rota não mapeada
        location / {
            return 404;
        }
    }

    # =====================================================================
    # Servidores dedicados para os 3 dashboards (1 porta cada)
    # =====================================================================
    # Cada dashboard roda da raiz da sua porta, sem sub_filter. O nginx
    # faz apenas autenticacao e proxy passthrough, incluindo WebSocket.
    # Reusa os mesmos .htpasswd-user_0X dos chats — mesmo usuario,
    # mesma credencial.
    # =====================================================================

    server {
        listen 9001;
        server_name _;

        auth_basic           "Hermes Dashboard 1";
        auth_basic_user_file /etc/nginx/.htpasswd-user_01;

        location / {
            proxy_pass         http://dash_user01;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket (PTY/TUI), SSE
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    server {
        listen 9002;
        server_name _;

        auth_basic           "Hermes Dashboard 2";
        auth_basic_user_file /etc/nginx/.htpasswd-user_02;

        location / {
            proxy_pass         http://dash_user02;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    server {
        listen 9003;
        server_name _;

        auth_basic           "Hermes Dashboard 3";
        auth_basic_user_file /etc/nginx/.htpasswd-user_03;

        location / {
            proxy_pass         http://dash_user03;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
